<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Ostdeutschland</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#eef3f8;color:#172c42;margin:0}main{max-width:780px;margin:25px auto;padding:15px}header{background:#173e60;color:white;padding:28px;border-radius:18px}h1{margin:0}section{background:white;border-radius:18px;padding:25px;margin-top:18px;box-shadow:0 4px 18px #173e6016}.choices{display:grid;gap:12px;margin:22px 0}button{font:inherit;text-align:left;border:1px solid #aebdca;border-radius:10px;background:white;padding:14px;cursor:pointer;color:#173e60}button:hover:not(:disabled){background:#e8f3fc}.right{background:#daf5e6!important;border-color:#267b4c}.wrong{background:#ffe2df!important;border-color:#bd433a}.next{background:#174f79;color:white;font-weight:bold;text-align:center;border:0}progress{width:100%;accent-color:#2476aa}#feedback{min-height:32px;font-weight:600}.sub{opacity:.8}.translation{color:#52677a;font-size:.96rem;margin-top:-8px;margin-bottom:18px;font-style:italic}@media(max-width:600px){main{margin:0;padding:9px}section,header{padding:18px}}</style></head><body><main><header><h1>Mission Ostdeutschland</h1><p>Fit für die Klassenarbeit · Terminale LVB</p><p>40 Aufgaben · Wortschatz, Relativsätze, Satzbau und politische Erklärungen</p></header><section><p id="counter"></p><progress id="progress" max="40" value="0"></progress><p class="sub" id="group"></p><h2 id="question"></h2><p class="translation" id="translation" lang="fr"></p><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button class="next" id="next" hidden>Weiter →</button></section><p class="sub">Übung mit sofortiger Rückmeldung. Die Klassenarbeit enthält andere Aufgaben.</p></main><script>const data=[{"q":"Fremdbestimmung bedeutet …","a":["Andere entscheiden über mich.","Alle entscheiden selbst.","Ich wähle direkt."],"correct":0,"group":"Wortschatz","fr":"Que signifie « Fremdbestimmung » ?"},{"q":"Misstrauen bedeutet …","a":["Wenig Vertrauen haben.","Sich von anderen bestimmen lassen.","Bei Entscheidungen nicht vertreten sein."],"correct":0,"group":"Wortschatz","fr":"Que signifie « Misstrauen » ?"},{"q":"Unterrepräsentation bedeutet …","a":["Nur wenige Ostdeutsche haben wichtige Positionen.","Wenig Vertrauen in politische Institutionen haben.","Bei politischen Entscheidungen von anderen abhängig sein."],"correct":0,"group":"Wortschatz","fr":"Que signifie « Unterrepräsentation » ?"},{"q":"Direkte Demokratie bedeutet …","a":["Bürger können selbst abstimmen.","Bürger wählen nur Vertreter, die dann allein entscheiden.","Parteien entscheiden ohne Beteiligung der Bürger."],"correct":0,"group":"Wortschatz","fr":"Que signifie « direkte Demokratie » ?"},{"q":"Was passt zu 'Fremdbestimmung'?","a":["Andere entscheiden über mich.","Ich kann bei Entscheidungen selbst mitbestimmen.","Ich habe kein Vertrauen in die Regierung."],"correct":0,"group":"Wortschatz","fr":"Quelle proposition correspond à « Fremdbestimmung » ?"},{"q":"Was passt zu 'Misstrauen'?","a":["Wenig Vertrauen in Politiker.","Wenig Einfluss auf politische Entscheidungen.","Wenig Vertretung in wichtigen Ämtern."],"correct":0,"group":"Wortschatz","fr":"Quelle proposition correspond à « Misstrauen » ?"},{"q":"Was passt zu 'Unterrepräsentation'?","a":["Wenige Ostdeutsche in wichtigen Positionen.","Wenig Vertrauen in politische Parteien.","Wenig direkte Beteiligung an Abstimmungen."],"correct":0,"group":"Wortschatz","fr":"Quelle proposition correspond à « Unterrepräsentation » ?"},{"q":"Was bedeutet 'Einfluss haben'?","a":["Mitbestimmen können.","Bei einer Wahl seine Stimme abgeben.","Die Finanzierung von Parteien überprüfen."],"correct":0,"group":"Wortschatz","fr":"Que signifie « avoir de l'influence » ?"},{"q":"Was bedeutet 'abstimmen'?","a":["Über eine Frage entscheiden.","Zwischen Kandidaten bei einer Wahl wählen.","Eine politische Entscheidung nur erklären."],"correct":0,"group":"Wortschatz","fr":"Que signifie « abstimmen » ?"},{"q":"Was bedeutet 'wählen'?","a":["Choisir ou élire une personne ou un parti.","Voter sur une question précise lors d'un référendum.","Participer à une décision sans prendre part au vote."],"correct":0,"group":"Wortschatz","fr":"Que signifie « wählen » ?"},{"q":"Was passt zu 'freie Listenwahl'?","a":["Bürger können Personen direkt wählen.","Bürger können nur eine vorgegebene Parteiliste wählen.","Parteien bestimmen die Reihenfolge, ohne dass Wähler sie ändern können."],"correct":0,"group":"Wortschatz","fr":"Quelle proposition correspond à « freie Listenwahl » ?"},{"q":"Was passt zu 'Kontrolle der Parteienfinanzierung'?","a":["Kontrollieren, woher das Geld kommt.","Kontrollieren, welche Kandidaten gewählt werden.","Kontrollieren, wie viele Bürger zur Wahl gehen."],"correct":0,"group":"Wortschatz","fr":"Quelle proposition correspond au contrôle du financement des partis ?"},{"q":"Fremdbestimmung ist, ___ andere über mich entscheiden.","a":["wenn","weil","denn"],"correct":0,"group":"Satzbau","fr":"Complète la phrase : la dépendance envers les décisions d'autrui existe lorsque…"},{"q":"Mehr Demokratie kann helfen, ___ Bürger selbst entscheiden können.","a":["weil","deshalb","denn"],"correct":0,"group":"Satzbau","fr":"Complète la phrase : plus de démocratie peut aider parce que…"},{"q":"Die Menschen wollen Kontrolle, ___ sie haben wenig Vertrauen.","a":["denn","weil","deshalb"],"correct":0,"group":"Satzbau","fr":"Complète la phrase : les gens veulent du contrôle, car…"},{"q":"Viele Bürger wollen mehr Einfluss. ___ fordern sie mehr Demokratie.","a":["Deshalb","Weil","Denn"],"correct":0,"group":"Satzbau","fr":"Complète la phrase : de nombreux citoyens veulent plus d'influence. C'est pourquoi…"},{"q":"Nach 'weil' steht das konjugierte Verb …","a":["am Ende.","immer an Position 1.","immer an Position 2."],"correct":0,"group":"Satzbau","fr":"Où se place le verbe conjugué après « weil » ?"},{"q":"Die Menschen wollen Kontrolle, denn ___.","a":["sie haben wenig Vertrauen.","haben sie wenig Vertrauen.","sie wenig Vertrauen haben."],"correct":0,"group":"Satzbau","fr":"Complète correctement la phrase avec « denn » (car)."},{"q":"Nach 'deshalb' am Satzanfang steht …","a":["das konjugierte Verb.","immer ein Infinitiv.","immer ein Artikel."],"correct":0,"group":"Satzbau","fr":"Que place-t-on après « deshalb » en début de phrase ?"},{"q":"Welche Wortstellung stimmt?","a":["…, weil die Bürger selbst entscheiden können.","…, weil können die Bürger selbst entscheiden.","…, weil die Bürger können selbst entscheiden."],"correct":0,"group":"Satzbau","fr":"Quel ordre des mots est correct ?"},{"q":"Welche Wortstellung stimmt?","a":["Deshalb wollen die Bürger mehr Einfluss.","Deshalb die Bürger wollen mehr Einfluss.","Deshalb mehr Einfluss wollen die Bürger."],"correct":0,"group":"Satzbau","fr":"Quel ordre des mots est correct ?"},{"q":"Welche Wortstellung stimmt?","a":["Die Menschen wollen Kontrolle, denn sie haben wenig Vertrauen.","Die Menschen wollen Kontrolle, denn haben sie wenig Vertrauen.","Die Menschen wollen Kontrolle, denn sie wenig Vertrauen haben."],"correct":0,"group":"Satzbau","fr":"Quel ordre des mots est correct ?"},{"q":"Ein Politiker, ___ aus Ostdeutschland kommt, …","a":["der","die","das"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : un homme politique qui vient d'Allemagne de l'Est…"},{"q":"Menschen, ___ wenig Vertrauen haben, …","a":["die","der","das"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : des personnes qui ont peu confiance…"},{"q":"Ein Problem, ___ viele Bürger kennen, …","a":["das","der","die"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : un problème que beaucoup de citoyens connaissent…"},{"q":"Die Bürger, ___ in Ostdeutschland leben, …","a":["die","den","dem"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : les citoyens qui vivent en Allemagne de l'Est…"},{"q":"Ein Vorschlag, ___ den Bürgern helfen soll, …","a":["der","das","die"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : une proposition qui doit aider les citoyens…"},{"q":"Eine Partei, ___ Vorschläge macht, …","a":["die","der","das"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : un parti qui fait des propositions…"},{"q":"Ein Politiker, ___ viele Bürger kennen, …","a":["den","der","dem"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : un homme politique que beaucoup de citoyens connaissent…"},{"q":"Das ist eine Frage, ___ viele Menschen wichtig finden.","a":["die","der","das"],"correct":0,"group":"Relativsätze","fr":"Complète la proposition relative : c'est une question que beaucoup de gens trouvent importante."},{"q":"Welche Form ist ein Relativsatz?","a":["Menschen, die in Ostdeutschland leben, …","Menschen weil sie leben …","Menschen deshalb leben …"],"correct":0,"group":"Relativsätze","fr":"Quelle proposition contient une relative ?"},{"q":"Quelle affirmation sur les propositions relatives est correcte ?","a":["Dans une proposition relative allemande, le verbe conjugué se place à la fin.","Dans une proposition relative allemande, le verbe conjugué se place immédiatement après le pronom relatif.","Dans une proposition relative allemande, le verbe conjugué se place toujours en deuxième position, comme dans une proposition principale."],"correct":0,"group":"Relativsätze","fr":"Choisis la règle correcte concernant la place du verbe dans une proposition relative."},{"q":"Mehr direkte Demokratie passt zu …","a":["Fremdbestimmung.","Misstrauen gegenüber politischen Institutionen.","Unterrepräsentation in Führungspositionen."],"correct":0,"group":"Probleme und Vorschläge","fr":"À quel problème correspond davantage de démocratie directe ?"},{"q":"Mehr Kontrolle passt zu …","a":["Misstrauen.","Unterrepräsentation.","Fremdbestimmung."],"correct":0,"group":"Probleme und Vorschläge","fr":"À quel problème correspond davantage de contrôle ?"},{"q":"Freie Listenwahl passt zu …","a":["Unterrepräsentation.","Fremdbestimmung.","Misstrauen gegenüber den Parteien."],"correct":0,"group":"Probleme und Vorschläge","fr":"À quel problème correspond le libre choix des candidats sur les listes ?"},{"q":"Welche Erklärung passt?","a":["Fremdbestimmung ist, wenn andere über mich entscheiden.","Unterrepräsentation ist, wenn andere über mich entscheiden.","Misstrauen ist, wenn andere über mich entscheiden."],"correct":0,"group":"Probleme und Vorschläge","fr":"Quelle explication convient ?"},{"q":"Welche Erklärung passt?","a":["Misstrauen ist, wenn man wenig Vertrauen hat.","Unterrepräsentation ist, wenn man wenig Vertrauen hat.","Fremdbestimmung ist, wenn man wenig Vertrauen hat."],"correct":0,"group":"Probleme und Vorschläge","fr":"Quelle explication convient ?"},{"q":"Welche Begründung passt?","a":["Mehr Demokratie kann helfen, weil die Bürger selbst entscheiden können.","Mehr Demokratie kann helfen, weil entscheiden die Bürger selbst.","Mehr Demokratie kann helfen, denn die Bürger selbst entscheiden können."],"correct":0,"group":"Probleme und Vorschläge","fr":"Quelle justification convient ?"},{"q":"Welche Aussage ist vorsichtig formuliert?","a":["Der Vorschlag kann helfen.","Der Vorschlag löst immer alle Probleme.","Alle Menschen sind einverstanden."],"correct":0,"group":"Probleme und Vorschläge","fr":"Quelle formulation est prudente ?"},{"q":"Was ist eine Erklärung und keine Bewertung?","a":["Manche Menschen wollen mehr Einfluss.","Alle Vorschläge sind perfekt.","Diese Partei hat immer recht."],"correct":0,"group":"Probleme und Vorschläge","fr":"Quelle phrase est une explication et non un jugement ?"}];let order=[],pos=0,score=0,done=false;const e=id=>document.getElementById(id);function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v)}function start(){order=[...data];pos=0;score=0;render()}function render(){done=false;let x=order[pos];e('counter').textContent='Aufgabe '+(pos+1)+' von '+order.length+' · '+score+' richtig';e('progress').value=pos;e('group').textContent=x.group;e('question').textContent=x.q;e('translation').textContent=x.fr;e('feedback').textContent='';e('next').hidden=true;e('choices').innerHTML='';shuffle(x.a.map((s,i)=>({s,i}))).forEach(o=>{let b=document.createElement('button');b.textContent=o.s;b.onclick=()=>answer(o.i,b);e('choices').appendChild(b)})}function answer(i,b){if(done)return;done=true;let x=order[pos];if(i===x.correct)score++;for(let c of e('choices').children){c.disabled=true;if(c.textContent===x.a[x.correct])c.classList.add('right')}if(i!==x.correct)b.classList.add('wrong');e('feedback').textContent=(i===x.correct?'Richtig! ':'Nicht ganz. ')+'Richtige Antwort: '+x.a[x.correct];e('next').hidden=false;e('next').textContent=pos===order.length-1?'Ergebnis ansehen':'Weiter →'}e('next').onclick=()=>{if(pos===order.length){start();return}pos++;if(pos<order.length)render();else{e('progress').value=40;e('counter').textContent='Fertig!';e('group').textContent='';e('question').textContent='Dein Ergebnis: '+score+' / 40';e('translation').textContent='';e('choices').innerHTML='';e('feedback').textContent='Du kannst alle Aufgaben wiederholen.';e('next').textContent='Noch einmal üben';e('next').hidden=false}};start();</script></body></html>
