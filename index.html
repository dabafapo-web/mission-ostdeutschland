<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Ostdeutschland</title><style>*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#eef3f8;color:#172c42;margin:0}main{max-width:780px;margin:25px auto;padding:15px}header{background:#173e60;color:white;padding:28px;border-radius:18px}h1{margin:0}section{background:white;border-radius:18px;padding:25px;margin-top:18px;box-shadow:0 4px 18px #173e6016}.choices{display:grid;gap:12px;margin:22px 0}button{font:inherit;text-align:left;border:1px solid #aebdca;border-radius:10px;background:white;padding:14px;cursor:pointer;color:#173e60}button:hover:not(:disabled){background:#e8f3fc}.right{background:#daf5e6!important;border-color:#267b4c}.wrong{background:#ffe2df!important;border-color:#bd433a}.next{background:#174f79;color:white;font-weight:bold;text-align:center;border:0}progress{width:100%;accent-color:#2476aa}#feedback{min-height:32px;font-weight:600}.sub{opacity:.8}@media(max-width:600px){main{margin:0;padding:9px}section,header{padding:18px}}</style></head><body><main><header><h1>Mission Ostdeutschland</h1><p>Fit für die Klassenarbeit · Terminale LVB</p><p>40 Aufgaben · Wortschatz, Relativsätze, Satzbau und politische Erklärungen</p></header><section><p id="counter"></p><progress id="progress" max="40" value="0"></progress><p class="sub" id="group"></p><h2 id="question"></h2><div id="choices" class="choices"></div><p id="feedback" aria-live="polite"></p><button class="next" id="next" hidden>Weiter →</button></section><p class="sub">Übung mit sofortiger Rückmeldung. Die Klassenarbeit enthält andere Aufgaben.</p></main><script>const data=[{"q":"Fremdbestimmung bedeutet …","a":["Andere entscheiden über mich.","Alle entscheiden selbst.","Ich wähle direkt."],"correct":0,"group":"Wortschatz"},{"q":"Misstrauen bedeutet …","a":["Wenig Vertrauen haben.","Viel Geld haben.","Mehr Freizeit haben."],"correct":0,"group":"Wortschatz"},{"q":"Unterrepräsentation bedeutet …","a":["Nur wenige Ostdeutsche haben wichtige Positionen.","Alle sind Politiker.","Alle wählen direkt."],"correct":0,"group":"Wortschatz"},{"q":"Direkte Demokratie bedeutet …","a":["Bürger können selbst abstimmen.","Nur Politiker stimmen ab.","Niemand entscheidet."],"correct":0,"group":"Wortschatz"},{"q":"Was passt zu 'Fremdbestimmung'?","a":["Andere entscheiden über mich.","Ich habe viel Vertrauen.","Ich wähle frei."],"correct":0,"group":"Wortschatz"},{"q":"Was passt zu 'Misstrauen'?","a":["Wenig Vertrauen in Politiker.","Mehr Sport treiben.","Mehr Urlaub machen."],"correct":0,"group":"Wortschatz"},{"q":"Was passt zu 'Unterrepräsentation'?","a":["Wenige Ostdeutsche in wichtigen Positionen.","Viele neue Schulen.","Mehr Freizeit."],"correct":0,"group":"Wortschatz"},{"q":"Was bedeutet 'Einfluss haben'?","a":["Mitbestimmen können.","Nichts wissen.","Weggehen."],"correct":0,"group":"Wortschatz"},{"q":"Was bedeutet 'abstimmen'?","a":["Über eine Frage entscheiden.","Eine Frage vergessen.","Geld verdienen."],"correct":0,"group":"Wortschatz"},{"q":"Was bedeutet 'wählen'?","a":["Eine Person oder Partei auswählen.","Eine Person besuchen.","Eine Frage erklären."],"correct":0,"group":"Wortschatz"},{"q":"Was passt zu 'freie Listenwahl'?","a":["Bürger können Personen direkt wählen.","Politiker verbieten Wahlen.","Bürger dürfen nicht wählen."],"correct":0,"group":"Wortschatz"},{"q":"Was passt zu 'Kontrolle der Parteienfinanzierung'?","a":["Kontrollieren, woher das Geld kommt.","Alle Parteien abschaffen.","Mehr Schulen bauen."],"correct":0,"group":"Wortschatz"},{"q":"Fremdbestimmung ist, ___ andere über mich entscheiden.","a":["wenn","weil","denn"],"correct":0,"group":"Satzbau"},{"q":"Mehr Demokratie kann helfen, ___ Bürger selbst entscheiden können.","a":["weil","deshalb","denn"],"correct":0,"group":"Satzbau"},{"q":"Die Menschen wollen Kontrolle, ___ sie haben wenig Vertrauen.","a":["denn","weil","deshalb"],"correct":0,"group": roup":"Relativsätze"},{"q":"Das ist eine Frage, ___ viele Menschen wichtig finden.","a":["die","der","das"],"correct":0,"group":"Relativsätze"},{"q":"Welche Form ist ein Relativsatz?","a":["Menschen, die in Ostdeutschland leben, …","Menschen weil sie leben …","Menschen deshalb leben …"],"correct":0,"group":"Relativsätze"},{"q":"Welche Aussage ist richtig?","a":["Das Relativverb steht am Ende.","Das Relativverb steht immer zuerst.","Im Relativsatz gibt es kein Verb."],"correct":0,"group":"Relativsätze"},{"q":"Mehr direkte Demokratie passt zu …","a":["Fremdbestimmung.","Schulferien.","Wetter."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Mehr Kontrolle passt zu …","a":["Misstrauen.","Sport.","Essen."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Freie Listenwahl passt zu …","a":["Unterrepräsentation.","Musik.","Freizeit."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Welche Erklärung passt?","a":["Fremdbestimmung ist, wenn andere über mich entscheiden.","Fremdbestimmung ist, wenn ich immer selbst entscheide.","Fremdbestimmung ist, wenn alle Vertrauen haben."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Welche Erklärung passt?","a":["Misstrauen ist, wenn man wenig Vertrauen hat.","Misstrauen ist, wenn man alle kennt.","Misstrauen ist, wenn man selbst abstimmt."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Welche Begründung passt?","a":["Mehr Demokratie kann helfen, weil die Bürger selbst entscheiden können.","Mehr Demokratie kann helfen, weil entscheiden die Bürger selbst.","Mehr Demokratie kann helfen, denn die Bürger selbst entscheiden können."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Welche Aussage ist vorsichtig formuliert?","a":["Der Vorschlag kann helfen.","Der Vorschlag löst immer alle Probleme.","Alle Menschen sind einverstanden."],"correct":0,"group":"Probleme und Vorschläge"},{"q":"Was ist eine Erklärung und keine Bewertung?","a":["Manche Menschen wollen mehr Einfluss.","Alle Vorschläge sind perfekt.","Diese Partei hat immer recht."],"correct":0,"group":"Probleme und Vorschläge"}];let order=[],pos=0,score=0,done=false;const e=id=>document.getElementById(id);function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v)}function start(){order=[...data];pos=0;score=0;render()}function render(){done=false;let x=order[pos];e('counter').textContent='Aufgabe '+(pos+1)+' von '+order.length+' · '+score+' richtig';e('progress').value=pos;e('group').textContent=x.group;e('question').textContent=x.q;e('feedback').textContent='';e('next').hidden=true;e('choices').innerHTML='';shuffle(x.a.map((s,i)=>({s,i}))).forEach(o=>{let b=document.createElement('button');b.textContent=o.s;b.onclick=()=>answer(o.i,b);e('choices').appendChild(b)})}function answer(i,b){if(done)return;done=true;let x=order[pos];if(i===x.correct)score++;for(let c of e('choices').children){c.disabled=true;if(c.textContent===x.a[x.correct])c.classList.add('right')}if(i!==x.correct)b.classList.add('wrong');e('feedback').textContent=(i===x.correct?'Richtig! ':'Nicht ganz. ')+'Richtige Antwort: '+x.a[x.correct];e('next').hidden=false;e('next').textContent=pos===order.length-1?'Ergebnis ansehen':'Weiter →'}e('next').onclick=()=>{if(pos===order.length){start();return}pos++;if(pos<order.length)render();else{e('progress').value=40;e('counter').textContent='Fertig!';e('group').textContent='';e('question').textContent='Dein Ergebnis: '+score+' / 40';e('choices').innerHTML='';e('feedback').textContent='Du kannst alle Aufgaben wiederholen.';e('next').textContent='Noch einmal üben';e('next').hidden=false}};start();</script></body></html>
